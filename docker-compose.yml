services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: tiza
      POSTGRES_PASSWORD: tiza
      POSTGRES_DB: tiza
    volumes:
      - tiza_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiza -d tiza"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - tiza_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Life Room for daily use on this PC: `pnpm local:up` -> http://localhost:8080 ---
  # Separate database from the dev/test one above, so test signups never touch real data.
  app-db:
    profiles: [app]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: liferoom
      POSTGRES_PASSWORD: liferoom
      POSTGRES_DB: liferoom
    volumes:
      - life_room_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U liferoom -d liferoom"]
      interval: 5s
      timeout: 5s
      retries: 10

  app-api:
    profiles: [app]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      app-db: { condition: service_healthy }
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://liferoom:liferoom@app-db:5432/liferoom
      CORS_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8081:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  app-web:
    profiles: [app]
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8081
    restart: unless-stopped
    depends_on:
      app-api: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:3000"

volumes:
  life_room_data:
  tiza_postgres:
  tiza_redis:
